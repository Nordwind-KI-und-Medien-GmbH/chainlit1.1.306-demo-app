services:
  db:
    image: postgres:15
    container_name: simple-rag-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: simple_rag
      POSTGRES_PASSWORD: simple_rag
      POSTGRES_DB: simple_rag
    volumes:
      # - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

